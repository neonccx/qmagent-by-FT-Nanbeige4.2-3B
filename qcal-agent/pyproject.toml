[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcal-agent"
version = "1.0.0"
description = "Single-qubit calibration Agent runtime and measurement layer"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
terminal = ["rich>=13.9,<16", "prompt-toolkit>=3.0.43,<4"]
report = ["matplotlib>=3.9,<4"]
model = ["torch>=2.5", "transformers>=4.45,<5", "peft>=0.13", "accelerate>=1"]
all = ["rich>=13.9,<16", "prompt-toolkit>=3.0.43,<4", "matplotlib>=3.9,<4"]

[project.scripts]
qm-agent = "qmagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
